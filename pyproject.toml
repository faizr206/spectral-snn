[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-snn"
version = "0.1.0"
description = "Experiment runner for Dendritic Resonate-and-Fire spectral gating research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "h5py>=3.11,<4",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "seaborn>=0.13,<0.14",
  "spikingjelly>=0.0.0.0.14",
  "torch>=2.6,<2.8",
  "torchvision>=0.21,<0.23",
]

[project.optional-dependencies]
jax = [
  "jax[cuda12]>=0.4.30",
  "equinox>=0.11",
  "optax>=0.2",
]

[project.scripts]
drf-experiment = "drf_experiment.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
